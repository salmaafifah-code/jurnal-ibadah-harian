<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#245c3a">
    <title>Jurnal Ibadah Harian</title>
</head>

<body>
    <main>
        <h1>Jurnal Ibadah Harian</h1>

        <nav class="tab-list" role="tablist" aria-label="Bagian jurnal">
            <button class="tab-button" id="tab-jurnal" type="button" role="tab" aria-selected="true"
                aria-controls="panel-jurnal">Isi Jurnal</button>
            <button class="tab-button" id="tab-rekap" type="button" role="tab" aria-selected="false"
                aria-controls="panel-rekap">Rekap</button>
        </nav>

        <section id="panel-jurnal" class="tab-panel" role="tabpanel" aria-labelledby="tab-jurnal">
            <header class="jurnal-intro">
                <h2>Isi jurnal ibadah</h2>
                <p>Tandai ibadah yang sudah dilakukan hari ini.</p>
            </header>

            <div class="tanggal-card">
                <label for="tanggal">Tanggal jurnal</label>
                <input id="tanggal" name="tanggal" type="date">
            </div>

            <section class="jurnal-kelompok" aria-labelledby="judul-salat">
                <div class="jurnal-kelompok-header">
                    <h3 id="judul-salat">Salat dan sunnah</h3>
                </div>
                <div class="jurnal-grid">
                    <label class="ibadah-item"><input type="checkbox" name="salat"><span>Salat 5 waktu</span></label>
                    <label class="ibadah-item"><input type="checkbox" name="tahajud"><span>Tahajud 1/3 malam</span></label>
                    <label class="ibadah-item"><input type="checkbox" name="witir"><span>Witir setelah Isya</span></label>
                    <label class="ibadah-item"><input type="checkbox" name="dhuha"><span>Dhuha</span></label>
                    <label class="ibadah-item"><input type="checkbox" name="shaum"><span>Shaum</span></label>
                </div>

                <fieldset class="rawatib-card">
                    <legend>Salat Rawatib</legend>
                    <div class="jurnal-grid">
                        <label class="ibadah-item"><input type="checkbox" name="rawatib_subuh"><span>Qabla Subuh</span></label>
                        <label class="ibadah-item"><input type="checkbox" name="rawatib_dzuhur"><span>Qabla Dzuhur</span></label>
                        <label class="ibadah-item"><input type="checkbox" name="rawatib_bada_dzuhur"><span>Ba’da Dzuhur</span></label>
                        <label class="ibadah-item"><input type="checkbox" name="rawatib_maghrib"><span>Ba’da Maghrib</span></label>
                        <label class="ibadah-item"><input type="checkbox" name="rawatib_isya"><span>Ba’da Isya</span></label>
                    </div>
                </fieldset>
            </section>

            <section class="jurnal-kelompok" aria-labelledby="judul-quran">
                <div class="jurnal-kelompok-header">
                    <h3 id="judul-quran">Al-Qur’an dan dzikir</h3>
                </div>
                <div class="tilawah-card">
                    <label for="tilawah">Tilawah Al-Qur’an</label>
                    <div class="tilawah-input-baris">
                        <input id="tilawah" name="tilawah" type="number" min="0" value="0" inputmode="numeric">
                        <span>lembar</span>
                    </div>
                </div>
                <div class="jurnal-grid">
                    <label class="ibadah-item"><input type="checkbox" name="dzikir_pagi"><span>Dzikir pagi</span></label>
                    <label class="ibadah-item"><input type="checkbox" name="dzikir_petang"><span>Dzikir petang</span></label>
                    <label class="ibadah-item"><input type="checkbox" name="ratib"><span>Ratib</span></label>
                    <label class="ibadah-item"><input type="checkbox" name="almulk"><span>Al-Mulk setelah Isya / sebelum tidur</span></label>
                    <label class="ibadah-item"><input type="checkbox" name="murajaah"><span>Muraja’ah / Ziyadah</span></label>
                </div>
            </section>

            <section class="jurnal-kelompok" aria-labelledby="judul-amal">
                <div class="jurnal-kelompok-header">
                    <h3 id="judul-amal">Amal kebaikan</h3>
                </div>
                <div class="jurnal-grid">
                    <label class="ibadah-item"><input type="checkbox" name="sedekah"><span>Sedekah / Infak</span></label>
                </div>
            </section>

            <div class="jurnal-aksi">
                <button id="simpan" type="button">Simpan jurnal</button>
                <p id="pesan" role="status" aria-live="polite"></p>
            </div>
        </section>

        <section id="panel-rekap" class="tab-panel" role="tabpanel" aria-labelledby="tab-rekap" hidden>
            <h2>Rekap ibadah</h2>

            <label for="rekap-dari">Tanggal mulai</label>
            <input id="rekap-dari" type="date">

            <label for="rekap-sampai">Tanggal akhir</label>
            <input id="rekap-sampai" type="date">

            <button id="buat-rekap" type="button">Buat rekap</button>
            <button id="cetak-rekap" type="button" hidden>Cetak / simpan rekap sebagai PDF</button>
            <div id="hasil-rekap" aria-live="polite"></div>
        </section>

    </main>
    <section id="dokumen-rekap" class="dokumen-rekap" aria-label="Rekap ibadah untuk dicetak" hidden></section>
    <script src="app.js"></script>
</body>

</html>
